[package]
name = "sefai"
description = "A small local LLM runner and terminal harness."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = ["gguf"]
harness-model-tests = ["gguf"]
gguf = ["inference", "dep:sefai-engine-llama"]
mlx = ["inference", "dep:sefai-engine-mlx", "sefai-engine-mlx/runtime"]
mlx-model-tests = ["mlx"]
onnx = ["inference", "dep:sefai-engine-onnx", "sefai-engine-onnx/runtime"]
onnx-model-tests = ["onnx"]
onnx-webgpu = ["onnx", "sefai-engine-onnx/webgpu"]
inference = ["dep:ctrlc", "dep:ratatui", "dep:crossterm", "dep:unicode-segmentation", "dep:serde_json"]
mcp-fixture-tests = ["mcp-oauth"]
mcp-oauth = ["mcp-http", "rmcp/auth"]
mcp-http = ["mcp", "rmcp/transport-streamable-http-client", "dep:reqwest", "dep:futures-util", "dep:http", "dep:sse-stream"]
mcp = ["dep:rmcp", "dep:tokio", "dep:process-wrap", "dep:serde_json"]
metal = ["gguf", "sefai-engine-llama/metal"]
cuda = ["gguf", "sefai-engine-llama/cuda"]
vulkan = ["gguf", "sefai-engine-llama/vulkan"]

[dependencies]
reqwest = { version = "0.13", optional = true, default-features = false, features = ["rustls", "json", "stream"] }
futures-util = { version = "0.3", optional = true, default-features = false, features = ["std"] }
http = { version = "1", optional = true }
sse-stream = { version = "0.2", optional = true }
rmcp = { version = "=3.6.0", optional = true, default-features = false, features = ["client", "transport-async-rw"] }
tokio = { version = "1", optional = true, features = ["rt", "time", "process", "io-util", "sync"] }
process-wrap = { version = "10", optional = true, default-features = false, features = ["tokio1", "process-group", "job-object", "kill-on-drop"] }
serde_json = { version = "1", optional = true }
sefai-engine-llama = { path = "../engine-llama", optional = true, default-features = false }
sefai-engine-mlx = { path = "../engine-mlx", optional = true }
sefai-engine-onnx = { path = "../engine-onnx", optional = true }
sefai-core.workspace = true

clap.workspace = true
ctrlc = { version = "3.5.2", optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = { version = "2", default-features = false, features = ["deserialize"] }
ratatui = { optional = true, version = "0.30.2", default-features = false, features = ["crossterm", "unstable-rendered-line-info"] }
crossterm = { optional = true, version = "0.29.0", default-features = false, features = ["events", "bracketed-paste", "windows"] }
unicode-segmentation = { version = "1.13.3", optional = true }

[lints]
workspace = true

[[test]]
name = "harness_gguf"
required-features = ["harness-model-tests"]

[[test]]
name = "mcp_transport"
required-features = ["mcp-fixture-tests"]

[[test]]
name = "harness_mlx"
required-features = ["mlx-model-tests"]

[[test]]
name = "harness_onnx"
required-features = ["onnx-model-tests"]
