[package]
name = "sefai-engine-mlx"
description = "Optional native MLX bundle inference for Apple Silicon."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = []
model-tests = ["runtime"]
runtime = ["dep:mlx-lm", "dep:mlx-rs", "dep:thiserror"]

[dependencies]
sefai-core.workspace = true
serde_json = "1"
thiserror = { version = "2", optional = true }

[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
mlx-lm = { git = "https://github.com/oxiglade/mlx-rs", rev = "579199b4bb5e39b35f33fc6a59cb90e2c031a6a7", optional = true }
mlx-rs = { git = "https://github.com/oxiglade/mlx-rs", rev = "579199b4bb5e39b35f33fc6a59cb90e2c031a6a7", features = ["metal-jit"], optional = true }

[lints]
workspace = true

[[test]]
name = "mlx"
required-features = ["model-tests"]

[[example]]
name = "measure"
required-features = ["runtime"]
