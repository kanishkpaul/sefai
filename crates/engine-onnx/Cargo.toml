[package]
name = "sefai-engine-onnx"
description = "Optional ONNX Runtime inference for declared decoder exports."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = []
model-tests = ["runtime"]
webgpu = ["runtime", "ort/webgpu", "ort/copy-dylibs"]
runtime = ["dep:half", "dep:minijinja", "dep:minijinja-contrib", "dep:ort", "dep:thiserror", "dep:tokenizers"]

[dependencies]
sefai-core.workspace = true
serde_json = "1"
half = { version = "2", optional = true }
minijinja = { version = "2", optional = true }
minijinja-contrib = { version = "2", optional = true, features = ["pycompat"] }
ort = { version = "=2.0.0-rc.15", optional = true, default-features = false, features = ["std", "download-binaries", "half", "tls-native"] }
thiserror = { version = "2", optional = true }
tokenizers = { version = "0.22", optional = true, default-features = false, features = ["onig"] }

[lints]
workspace = true

[[test]]
name = "onnx"
required-features = ["model-tests"]
