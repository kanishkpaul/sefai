[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["vendor/mlx-sys"]
default-members = ["crates/sefai"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/kanishkpaul/sefai"
publish = false

[workspace.dependencies]
sefai-core = { path = "crates/core" }

clap = { version = "4.6.7", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"

[patch."https://github.com/oxiglade/mlx-rs"]
mlx-sys = { path = "vendor/mlx-sys" }
