[workspace]
resolver = "3"
members = ["crates/*", "abilities/*"]
default-members = ["crates/sefai"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/kanishkpaul/sefai"
publish = false

[workspace.dependencies]
sefai-core = { path = "crates/core" }
sefai-ability-persona = { path = "abilities/persona" }

anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
toml = "1.1.8"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
