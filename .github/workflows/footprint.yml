name: footprint

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: footprint-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  footprint:
    name: footprint (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install native CPU build tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake clang libclang-dev
      - name: Locate Windows libclang
        if: runner.os == 'Windows'
        shell: pwsh
        run: '"LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV'
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-rust-footprint-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
      - name: Measure the CPU builds' idle and GGUF footprint
        shell: bash
        run: |
          set -euo pipefail
          extension=""
          if [ "$RUNNER_OS" = "Windows" ]; then extension=".exe"; fi
          python3 scripts/fetch_fixture.py tests/fixtures/gguf.json fixture.gguf
          mkdir -p footprint
          cargo build --locked --release -p sefai
          cp "target/release/sefai$extension" "footprint/sefai-gguf$extension"
          cargo build --locked --release -p sefai --features mcp-oauth
          cp "target/release/sefai$extension" "footprint/sefai-mcp$extension"
          cargo build --locked --release -p sefai --no-default-features
          cp "target/release/sefai$extension" "footprint/sefai-minimal$extension"
          python3 scripts/measure_footprint.py idle "footprint/sefai-gguf$extension" > footprint/idle-gguf.json
          python3 scripts/measure_footprint.py idle "footprint/sefai-mcp$extension" > footprint/idle-mcp.json
          python3 scripts/measure_footprint.py bench "footprint/sefai-gguf$extension" -- --raw --model fixture.gguf --context 4096 --output 64 --repetitions 3 "$(python3 -c 'print(" a" * 512)')" > footprint/bench-gguf-cpu.json
          python3 -c 'import os, json; print(json.dumps({"minimal_binary_bytes": os.path.getsize("footprint/sefai-minimal'"$extension"'")}))' > footprint/minimal.json
          cat footprint/*.json
      - name: Run the GGUF lifecycle contract on CPU
        shell: bash
        env:
          SEFAI_LIFECYCLE_GGUF: ${{ github.workspace }}/fixture.gguf
        run: cargo test --locked --release -p sefai --features harness-model-tests --test lifecycle_gguf -- --test-threads=1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: footprint-${{ matrix.os }}
          path: footprint/*.json
