name: ci

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install native CPU build tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake clang libclang-dev
      - name: Locate Windows libclang
        if: runner.os == 'Windows'
        shell: pwsh
        run: '"LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV'
      - run: rustup component add rustfmt clippy
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-rust-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo clippy --locked -p sefai --no-default-features --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      - run: cargo clippy --locked -p sefai --features mcp-fixture-tests,harness-model-tests --all-targets -- -D warnings
      - run: cargo clippy --locked -p sefai --no-default-features --features mcp-oauth --all-targets -- -D warnings
      - run: cargo test --locked -p sefai --features mcp-oauth --bin sefai
      - run: cargo test --locked -p sefai --no-default-features --features mcp-oauth
      - name: Test MCP processes and authenticated loopback transports
        shell: bash
        run: |
          export SEFAI_MCP_TEST_PYTHON="$(python3 -c 'import sys; print(sys.executable)')"
          cargo test --locked -p sefai --features mcp-fixture-tests --test mcp_transport
      - name: Install the optional Apple Metal compiler
        if: runner.os == 'macOS'
        run: |
          if ! xcrun metal --version; then
            xcodebuild -downloadComponent MetalToolchain
          fi
          xcrun metal --version
      - name: Check native MLX without requiring a hosted GPU
        if: runner.os == 'macOS'
        env:
          MLX_RS_METAL_PATH: ${{ github.workspace }}/target/mlx-metal
        run: |
          cargo clippy --locked -p sefai --no-default-features --features mlx,mlx-model-tests,mcp-oauth --all-targets -- -D warnings
          cargo clippy --locked -p sefai --features mlx,mlx-model-tests,mcp-oauth --all-targets -- -D warnings
          cargo clippy --locked -p sefai-engine-mlx --features model-tests --all-targets -- -D warnings
          cargo test --locked -p sefai --features mlx,mcp-oauth --bin sefai
          cargo test --locked -p sefai-engine-mlx --features runtime --lib
      - run: cargo test --locked -p sefai --no-default-features
      - run: cargo run --locked -- prompt hello
      - run: python3 -m unittest discover -s tests -v

      - name: Fetch the pinned GGUF fixture
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          model = json.loads(Path("tests/fixtures/gguf.json").read_text())
          url = f"https://huggingface.co/{model['repository']}/resolve/{model['revision']}/{model['file']}"
          Path("fixture-url.txt").write_text(url)
          PY
          curl --fail --location --retry 2 --max-time 300 "$(cat fixture-url.txt)" --output fixture.gguf
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          model = json.loads(Path("tests/fixtures/gguf.json").read_text())
          assert Path("fixture.gguf").stat().st_size == model["bytes"], "fixture size mismatch"
          with open("fixture.gguf", "rb") as source:
              assert hashlib.file_digest(source, "sha256").hexdigest() == model["sha256"], "fixture hash mismatch"
          PY
      - name: Test real GGUF inference on CPU
        shell: bash
        env:
          SEFAI_TEST_MODEL: ${{ github.workspace }}/fixture.gguf
          SEFAI_TEST_BACKEND: cpu
        run: |
          cargo test --locked -p sefai-engine-llama --features model-tests --test gguf
          cargo test --locked -p sefai-engine-llama --features model-tests --lib gguf_

      - name: Verify GGUF loading with both native libraries linked
        if: runner.os == 'macOS'
        env:
          MLX_RS_METAL_PATH: ${{ github.workspace }}/target/mlx-metal
        run: cargo run --locked --features mlx -- run --model fixture.gguf --threads 2 --output 8 hello

      - name: Fetch the pinned tool-capable GGUF fixture
        if: runner.os == 'Linux'
        shell: bash
        run: |
          python3 - <<'PYTHON'
          import hashlib, json, subprocess
          from pathlib import Path
          model = json.loads(Path("tests/fixtures/tool-gguf.json").read_text())
          url = f"https://huggingface.co/{model['repository']}/resolve/{model['revision']}/{model['file']}"
          subprocess.run(["curl", "--fail", "--location", "--retry", "2", "--max-time", "600", url, "--output", "tool-fixture.gguf"], check=True)
          assert Path("tool-fixture.gguf").stat().st_size == model["bytes"], "tool fixture size mismatch"
          with open("tool-fixture.gguf", "rb") as source:
              assert hashlib.file_digest(source, "sha256").hexdigest() == model["sha256"], "tool fixture hash mismatch"
          PYTHON
      - name: Test the real GGUF harness on CPU
        if: runner.os == 'Linux'
        shell: bash
        env:
          SEFAI_TOOL_TEST_MODEL: ${{ github.workspace }}/tool-fixture.gguf
        run: |
          export SEFAI_MCP_TEST_PYTHON="$(python3 -c 'import sys; print(sys.executable)')"
          cargo test --locked -p sefai --features harness-model-tests,mcp --test harness_gguf
