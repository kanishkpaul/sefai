name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo clippy -p sefai --no-default-features --all-targets -- -D warnings
      - run: cargo test --workspace

  attribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Reject AI tool or agent attribution in new commits
        env:
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          # Check only the commits this push or pull request adds.
          if [ -n "$BASE" ]; then
            range="$BASE..$HEAD_SHA"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            range="$BEFORE..$HEAD_SHA"
          else
            range="$HEAD_SHA^!"
          fi
          status=0
          for commit in $(git rev-list "$range"); do
            git log -1 --format=%B "$commit" > "$RUNNER_TEMP/message"
            if ! .githooks/commit-msg "$RUNNER_TEMP/message"; then
              echo "in commit $commit" >&2
              status=1
            fi
          done
          exit "$status"
